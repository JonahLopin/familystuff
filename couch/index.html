<script>
(function () {
  var P = JSON.parse(document.getElementById('payload').textContent);
  var KEY = 'familystuff-pw';
  function bytes(b64) { var s = atob(b64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  async function unlock(pw) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.ct));
    return new TextDecoder().decode(plain);
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  var form = document.getElementById('gate'), go = document.getElementById('go'), err = document.getElementById('err');
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    go.disabled = true; err.textContent = '';
    try {
      var html = await unlock(pw);
      try { localStorage.setItem(KEY, pw); } catch (_) {}
      show(html);
    } catch (_) {
      err.textContent = 'Wrong password.'; go.disabled = false;
    }
  });
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (_) {}
  if (saved) unlock(saved).then(show, function () { try { localStorage.removeItem(KEY); } catch (_) {} });
})();
</script>
